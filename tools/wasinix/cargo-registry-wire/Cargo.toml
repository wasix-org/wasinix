[package]
name = "cargo-registry-wire"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
thiserror = "2"
toml = "0.8"
ureq = "2"

[profile.release]
strip = true
