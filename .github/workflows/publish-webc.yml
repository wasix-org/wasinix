name: Publish webc

# Published versions are immutable, so nothing triggers this automatically:
# dispatch it by hand with the packages to publish.
on:
  workflow_dispatch:
    inputs:
      packages:
        description: Space-separated webc names (empty = all shipped)
        required: false
        default: ""
      registry:
        description: >-
          Target registry: wasmer.io (prod), wasmer.fun (bugtopia/staging),
          wasmer.wtf (dev)
        required: false
        default: wasmer.io
      dry-run:
        description: Only print what would be published
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-webc
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish webc packages
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Select wasmer registry
        uses: ./.github/actions/wasmer-registry
        with:
          registry: ${{ inputs.registry }}
          token-prod: ${{ secrets.WASMER_TOKEN }}
          token-staging: ${{ secrets.WASMER_TOKEN_STAGING }}
          token-dev: ${{ secrets.WASMER_TOKEN_DEV }}

      - name: Publish
        env:
          PACKAGES: ${{ inputs.packages }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ -z "$WASMER_TOKEN" ] && [ "$DRY_RUN" != "true" ]; then
            echo "WASMER_TOKEN secret is not set" >&2
            exit 1
          fi
          args=()
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          # shellcheck disable=SC2086
          nix run .#wasinix -- wasmer publish \
            --registry "$WASMER_REGISTRY" --rev "$GITHUB_SHA" \
            "${args[@]}" $PACKAGES
