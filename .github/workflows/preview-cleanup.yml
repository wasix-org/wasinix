name: PR preview cleanup

# Deletes the per-PR index app when the PR closes or drops the `preview`
# label. Preview webc prereleases cannot be deleted (registry versions are
# immutable); they accumulate in the preview namespace.
on:
  pull_request:
    types: [closed, unlabeled]

permissions:
  contents: read

jobs:
  cleanup:
    name: Delete preview index app
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' || github.event.label.name == 'preview')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # preview apps live where preview.yml puts them
      REGISTRY: wasmer.io
      NAMESPACE: kilyanni
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select wasmer registry
        uses: ./.github/actions/wasmer-registry
        with:
          registry: ${{ env.REGISTRY }}
          token-prod: ${{ secrets.WASMER_TOKEN }}
          token-staging: ${{ secrets.WASMER_TOKEN_STAGING }}
          token-dev: ${{ secrets.WASMER_TOKEN_DEV }}

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Delete apps
        id: delete_apps
        run: |
          for app in python-registry cargo-registry; do
            nix shell .#wasmer --accept-flake-config -c wasmer app delete \
              "$NAMESPACE/$app-pr${PR}" --registry "$WASMER_REGISTRY" --non-interactive \
              || echo "no $app preview app to delete"
          done
