name: Build

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write
  # in-job report posting on same-repo events (read-only on fork PRs, which
  # test-report.yml covers instead)
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # don't cancel main: let cache-warming runs finish (PRs still cancel)
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build all packages
    runs-on: depot-ubuntu-24.04-16
    # high ceiling for a cold cache; warm runs finish in minutes (max is 360)
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # the diff baseline is the PR's base commit, which a shallow
          # checkout does not have
          fetch-depth: 0

      - name: Free runner disk
        uses: ./.github/actions/free-disk

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      # The fetch cache above only avoids re-downloading tarballs; the unpacked
      # ...-source store paths still substitute from the cache bucket every run
      # (~40s). Persist their closure as a file:// binary cache. Exact key
      # only: restore-keys would accrete stale paths into every re-save.
      - name: Cache flake input closure
        id: input-closure
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: /tmp/input-store
          key: nix-input-closure-${{ hashFiles('flake.lock') }}

      # continue-on-error: a corrupt cache entry must not fail CI; the eval
      # below just falls back to substitution.
      - name: Import flake input closure
        if: steps.input-closure.outputs.cache-hit == 'true'
        continue-on-error: true
        run: nix copy --all --no-check-sigs --from 'file:///tmp/input-store'

      - name: Check Nix source
        run: nix flake check --print-build-logs

      # One CI run: a PR or merge-group event compares the change against its
      # base (reusing the base's published baseline instead of rebuilding it);
      # a push to main builds everything. The run directory carries the whole
      # result; everything after this step only publishes it.
      - name: CI run
        id: run
        shell: bash
        env:
          WASINIX_EVAL_WORKERS: "2"
          WASINIX_EVAL_MEMORY: "16384"
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
          BASE_SHA:
            ${{ github.event.pull_request.base.sha ||
            github.event.merge_group.base_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          # fork PRs hold a read-only token; their report comes from
          # test-report.yml after the run
          CAN_WRITE:
            ${{ github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository
            }}
        run: |
          # CI builds commits, never local edits: a dirty checkout here means
          # an earlier step mutated the tree, and building it would publish
          # artifacts no commit explains.
          git diff --quiet && git diff --cached --quiet || {
            echo "the checkout is dirty; CI only builds committed trees" >&2
            git status --short >&2
            exit 1
          }
          # Every credentialed run pushes as it builds: store paths are
          # input-addressed and baselines are keyed by the materialized git
          # tree, so both kinds of artifact verify their own key and reuse is
          # the only effect. Fork PRs carry no key and build without
          # uploading.
          push_cache=()
          if [ -n "$NIX_SIGNING_KEY" ]; then push_cache=(--push-cache); fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "runDir=run-dir" >> "$GITHUB_OUTPUT"
            nix run .#build -- all --on local --run-dir run-dir \
              "${push_cache[@]}"
          else
            # The run is durable so ci publish --watch can keep the check run
            # and PR comment fresh while it executes; the authoritative final
            # report is still Post report below. run start executes its
            # payload verbatim, so the payload names the binary itself.
            # Only the baseline (main's commit) is trusted; the candidate is not.
            bin="$(nix build .#wasinix-core --no-link --print-out-paths)/bin/wasinix"
            IFS=$'\t' read -r id dir < <("$bin" ci start \
              --github-output "$GITHUB_OUTPUT" -- \
              "$bin" -v diff --content-diff \
              --run-dir '{run-dir}' \
              "${push_cache[@]}" \
              build all --at "$BASE_SHA" --on local \
              --vs build all --on local)
            if [ "$CAN_WRITE" = true ]; then
              comment=()
              if [ -n "$PULL_REQUEST" ]; then comment=(--comment --pull-request "$PULL_REQUEST"); fi
              "$bin" ci publish --run-dir "$dir" --watch \
                --sha "$HEAD_SHA" \
                --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
                --check "${comment[@]}" \
                || echo "progress publishing stopped"
            else
              "$bin" run watch "$id" || true
            fi
            "$bin" run wait "$id"
          fi

      # after the run (whose eval realizes every input) so a build failure or
      # timeout can't lose the post-job cache save
      - name: Archive flake input closure
        if: always() && steps.input-closure.outputs.cache-hit != 'true'
        continue-on-error: true
        run: nix flake archive --to 'file:///tmp/input-store?compression=zstd'

      # consumed by test-report.yml (workflow_run, so fork PRs get the check
      # run and sticky comment too) and kept for debugging
      - name: Upload run
        id: run_artifact
        if: always() && steps.run.conclusion != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-run
          path: ${{ steps.run.outputs.runDir }}
          if-no-files-found: error

      # post the check run + sticky comment directly: bot-created PRs (the
      # pin bump) never fire workflow_run, and in-job is faster anyway.
      # Fork PRs have a read-only token here; test-report.yml covers them.
      - name: Post report
        if:
          ${{ always() && steps.run.conclusion != 'skipped' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          RUN_DIR: ${{ steps.run.outputs.runDir }}
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          comment=()
          if [ -n "$PULL_REQUEST" ]; then comment=(--comment --pull-request "$PULL_REQUEST"); fi
          # failure logs need S3 credentials, which fork PRs do not get
          logs=()
          if [ -n "$AWS_ACCESS_KEY_ID" ]; then logs=(--failure-logs); fi
          nix run .#ci -- publish --run-dir "$RUN_DIR" \
            --sha "$HEAD_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --check "${comment[@]}" "${logs[@]}" \
            --step-summary "$GITHUB_STEP_SUMMARY"

      # Publish every built case's eval map, keyed by its materialized tree:
      # future runs whose tree matches adopt it instead of re-evaluating and
      # rebuilding. PR runs publish too, so a rebase-merge's main run and a
      # re-push of an identical tree start warm. Fork PRs have no credentials
      # and skip.
      - name: Publish baseline
        id: baseline
        if: always() && steps.run.conclusion != 'skipped'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          RUN_DIR: ${{ steps.run.outputs.runDir }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "no credentials; skipping"
            exit 0
          fi
          nix run .#ci -- publish --run-dir "$RUN_DIR" --baseline

      - name: Collect durable runs
        id: collect
        if:
          ${{ always() && steps.run_artifact.outcome == 'success' &&
          (steps.baseline.outcome == 'success' || steps.baseline.outcome ==
          'skipped') }}
        run: nix run .#run -- gc --max-age-days 0

  # Which step was slow, per job, without opening any log. Every run
  # publishes its record, the way the baseline does: the builds that cost
  # anything happen on pull requests and in the merge queue, so a series of
  # pushes alone would measure a warm cache.
  timings:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Step timings
        uses: ./.github/actions/step-timings
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        with:
          publish: "true"
