name: CI report

# Turns CI's artifacts (build-report, rebuild-diff) into a "Per-package
# status" check run and, on PRs, a sticky comment. workflow_run runs in
# base-repo context with write perms, so fork PRs get both (in-job check
# creation and commenting can't).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read # download artifacts from the triggering run
  checks: write # create the check run
  pull-requests: write # sticky comment

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      # a run cancelled early may lack either artifact; the script renders
      # whatever is present
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: rebuild-diff
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: build-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const read = f => { try { return fs.readFileSync(f, 'utf8'); } catch { return null; } };

            const run = context.payload.workflow_run;
            const report = JSON.parse(read('report.json') ?? '{}');
            const title = report.title ?? `no report produced (run ${run.conclusion})`;
            const body = [read('build-report.md'), read('rebuild-diff.md')]
              .filter(Boolean).join('\n\n') || 'No report artifacts found.';
            // check run output.summary caps at 64k
            const summary = body.length > 60000 ? body.slice(0, 60000) + '\n\n(truncated)' : body;

            const { owner, repo } = context.repo;
            await github.rest.checks.create({
              owner, repo,
              name: 'Per-package status',
              head_sha: run.head_sha,
              status: 'completed',
              conclusion: ['success', 'failure', 'cancelled'].includes(run.conclusion)
                ? run.conclusion : 'neutral',
              output: { title, summary },
            });

            if (run.event !== 'pull_request') return;

            // workflow_run.pull_requests is empty for fork PRs; find by head sha
            let prs = run.pull_requests;
            if (!prs.length) {
              const res = await github.rest.repos.listPullRequestsAssociatedWithCommit(
                { owner, repo, commit_sha: run.head_sha });
              prs = res.data.filter(pr => pr.state === 'open');
            }
            if (!prs.length) {
              core.warning(`no PR found for ${run.head_sha}`);
              return;
            }
            const issue_number = prs[0].number;

            const marker = '<!-- wasinix-ci-report -->';
            const commentBody = marker + '\n' + summary;
            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment(
                { owner, repo, comment_id: existing.id, body: commentBody });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: commentBody });
            }
