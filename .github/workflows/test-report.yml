name: CI report

# Fork-PR half of the CI report: in a pull_request run from a fork the token
# is read-only, so build.yml can't post the check run or comment itself.
# workflow_run re-executes in base-repo context with write perms. Same-repo
# events (branches, the bot's pin-bump PRs, main, merge queue) are posted
# in-job by build.yml; bot-created PRs never fire workflow_run at all (events
# from GITHUB_TOKEN don't cascade), which is why this can't be the only path.
on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  contents: read
  actions: read # download artifacts from the triggering run
  checks: write # create the check run
  pull-requests: write # sticky comment

jobs:
  report:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    steps:
      # for scripts/post-report.js (default-branch code, not the PR's)
      - name: Checkout
        uses: actions/checkout@v4

      # a run cancelled early may lack either artifact; post-report.js renders
      # whatever is present
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: rebuild-diff
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: build-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const post = require('${{ github.workspace }}/scripts/post-report.js');
            await post({github, context, core});
