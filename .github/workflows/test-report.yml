name: CI report

# Fork-PR half of the CI report: in a pull_request run from a fork the token
# is read-only, so build.yml can't post the check run or comment itself.
# workflow_run re-executes in base-repo context with write perms. Same-repo
# events (branches, the bot's pin-bump PRs, main, merge queue) are posted
# in-job by build.yml; bot-created PRs never fire workflow_run at all (events
# from GITHUB_TOKEN don't cascade), which is why this can't be the only path.
on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  contents: read
  actions: read # download artifacts from the triggering run
  checks: write # create the check run
  pull-requests: write # sticky comment

jobs:
  report:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    steps:
      # for the wasinix binary (default-branch code, not the PR's)
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Resolve pull request
        id: context
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPOSITORY:
            ${{ github.event.workflow_run.head_repository.full_name }}
        run: >-
          nix run .#wasinix -- ci pull-request --repository "$GITHUB_REPOSITORY"
          --head-sha "$HEAD_SHA" --head-repository "$HEAD_REPOSITORY"
          --github-output "$GITHUB_OUTPUT"

      # a run cancelled early may lack the artifact; the report then has
      # nothing to say and the step below is skipped
      - name: Download run
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: ci-run
          path: run-dir
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # The PR identity comes from the trusted workflow_run event, never from
      # the artifact the PR's code produced. The report itself is untrusted:
      # a fork PR wrote it, so `--untrusted` makes the check neutral and marks
      # the surfaces advisory. The PR is resolved by commit, then constrained
      # to the fork's own open PR (same head repo and sha) so a fork sharing a
      # victim's head sha cannot drive the bot onto the victim's PR.
      - name: Post report
        if: steps.download.outcome == 'success'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          PULL_REQUEST: ${{ steps.context.outputs.pullRequest }}
        run: |
          comment=()
          if [ -n "$PULL_REQUEST" ]; then comment=(--comment --pull-request "$PULL_REQUEST"); fi
          nix run .#wasinix -- ci publish --run-dir run-dir \
            --sha "$HEAD_SHA" \
            --run-url "$RUN_URL" \
            --untrusted \
            --check "${comment[@]}" \
            --step-summary "$GITHUB_STEP_SUMMARY"
