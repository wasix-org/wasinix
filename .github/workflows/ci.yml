name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Forks and PRs without credentials still build and report; only the push
    # step is skipped.
    env:
      HAVE_CACHE_SECRETS: ${{ secrets.NIX_SIGNING_KEY != '' && secrets.S3_ACCESS_KEY_ID != '' && secrets.S3_SECRET_ACCESS_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31.9.1
        with:
          extra_nix_config: |
            extra-substituters = https://nix-cache.wasix.org
            extra-trusted-public-keys = wasinix-1:jvsqbOJGsZxMvg97fuyNCWCc+t2nn6uHB47kQCGNmXI=
            trusted-users = root runner

      # Builds every package independently and writes a JUnit report (one test
      # case per package). A broken package fails the check without blocking
      # the rest, and this step needs no secrets, so it always runs (incl.
      # forks).
      - name: Build
        id: build
        shell: bash
        run: ./scripts/ci-build.sh

      # Render the per-package JUnit report into the Checks UI with failure
      # annotations. always() so the report shows even when a package failed.
      - name: Report
        if: ${{ always() && steps.build.conclusion != 'skipped' }}
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        with:
          report_paths: nix-fast-build-result.xml
          require_tests: true
          detailed_summary: true

      # Independent of the build: signs and pushes whatever built successfully
      # and isn't in the cache yet. `always()` so good packages are still
      # cached even when another package failed above; gated on credentials so
      # secret-less PRs skip it gracefully. A push failure (e.g. cache down)
      # does not retroactively fail the build report.
      - name: Push to cache
        if: ${{ always() && env.HAVE_CACHE_SECRETS == 'true' }}
        shell: bash
        run: ./scripts/ci-push.sh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
