name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # don't cancel main: let cache-warming runs finish (PRs still cancel)
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build all packages
    runs-on: depot-ubuntu-24.04-16
    # high ceiling for a cold cache; warm runs finish in minutes (max is 360)
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31.9.1
        with:
          extra_nix_config: |
            extra-substituters = https://nix-cache.wasix.org
            extra-trusted-public-keys = wasinix-1:jvsqbOJGsZxMvg97fuyNCWCc+t2nn6uHB47kQCGNmXI=
            trusted-users = root runner

      # Persist nix's flake-input fetch cache (~2 min/run of cloning wasmer +
      # its transitive inputs). Keyed on flake.lock so it invalidates when inputs move.
      - name: Cache flake inputs
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ~/.cache/nix
          key: nix-flake-inputs-${{ hashFiles('flake.lock') }}
          restore-keys: nix-flake-inputs-

      # eval once (attr -> drvPath), diff against the base branch's published
      # map to surface what this change rebuilds; ci-build.sh reuses the raw
      # eval. Informational: a missing base map skips the diff, not the build.
      - name: Rebuild diff
        shell: bash
        run: |
          candidates=()
          base_ref=""
          case "${{ github.event_name }}" in
            pull_request) base_ref="${{ github.event.pull_request.base.ref }}" ;;
            merge_group) base_ref="${{ github.event.merge_group.base_ref }}" ;;
          esac
          if [ -n "$base_ref" ]; then
            # walk back: the newest base commits may not have published yet
            git fetch --quiet --depth=30 origin "$base_ref"
            mapfile -t candidates < <(git rev-list -n 30 FETCH_HEAD)
          fi
          ./scripts/eval-diff.py \
            --rev "${{ github.sha }}" \
            --jobs-out eval-jobs.jsonl \
            --map-out eval-map.json \
            --md-out rebuild-diff.md \
            --summary-out diff-summary.json \
            --base-rev "${candidates[@]}"
          cat rebuild-diff.md >>"$GITHUB_STEP_SUMMARY"

      # consumed by test-report.yml (workflow_run, so fork PRs get the check
      # run and sticky comment too); uploaded before the build so a timeout
      # still leaves the eval side of the report
      - name: Upload rebuild diff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rebuild-diff
          path: |
            rebuild-diff.md
            diff-summary.json

      # publish the eval map so future PRs can diff against this commit
      - name: Publish eval map
        if: github.event_name == 'push'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp --no-progress eval-map.json \
            "s3://wasinix-cache/eval-maps/${{ github.sha }}.json" \
            --endpoint-url https://1541b1e8a3fc6ad155ce67ef38899700.r2.cloudflarestorage.com

      # per-package build + JUnit report; uploads to cache as it builds when
      # credentials are present (forks build keyless), so timeouts don't lose work
      - name: Build packages
        id: build
        shell: bash
        run: ./scripts/ci-build.sh
        # empty on fork PRs → build runs without uploading
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
          JOBS_FILE: eval-jobs.jsonl

      # one-line status + per-failure details from the JUnit; test-report.yml
      # turns this into the check run title and the sticky comment
      - name: Render report
        if: ${{ always() && steps.build.conclusion != 'skipped' }}
        shell: bash
        run: |
          ./scripts/ci-report.py \
            --junit nix-fast-build-result.xml \
            --diff-summary diff-summary.json \
            --md-out build-report.md \
            --json-out report.json
          cat build-report.md >>"$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: ${{ always() && steps.build.conclusion != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-report
          path: |
            build-report.md
            report.json
            nix-fast-build-result.xml
          if-no-files-found: error
