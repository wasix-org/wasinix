name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write
  # in-job report posting on same-repo events (read-only on fork PRs, which
  # test-report.yml covers instead)
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # don't cancel main: let cache-warming runs finish (PRs still cancel)
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build all packages
    runs-on: depot-ubuntu-24.04-16
    # high ceiling for a cold cache; warm runs finish in minutes (max is 360)
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31.9.1
        with:
          extra_nix_config: |
            extra-substituters = https://nix-cache.wasix.org
            extra-trusted-public-keys = wasinix-1:jvsqbOJGsZxMvg97fuyNCWCc+t2nn6uHB47kQCGNmXI=
            trusted-users = root runner

      # Persist nix's flake-input fetch cache (~2 min/run of cloning wasmer +
      # its transitive inputs). Keyed on flake.lock so it invalidates when inputs move.
      - name: Cache flake inputs
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ~/.cache/nix
          key: nix-flake-inputs-${{ hashFiles('flake.lock') }}
          restore-keys: nix-flake-inputs-

      # eval once (attr -> drvPath), diff against the base branch's published
      # map to surface what this change rebuilds; ci-build.sh reuses the raw
      # eval. Informational: a missing base map skips the diff, an eval
      # failure becomes report content, and a script bug must not eat the
      # build or the report (the build step fails the job on real breakage)
      - name: Rebuild diff
        continue-on-error: true
        shell: bash
        run: |
          candidates=()
          base_ref=""
          case "${{ github.event_name }}" in
            pull_request) base_ref="${{ github.event.pull_request.base.ref }}" ;;
            merge_group) base_ref="${{ github.event.merge_group.base_ref }}" ;;
          esac
          if [ -n "$base_ref" ]; then
            # walk back: the newest base commits may not have published yet
            git fetch --quiet --depth=30 origin "$base_ref"
            mapfile -t candidates < <(git rev-list -n 30 FETCH_HEAD)
          fi
          # update notes: current versions ride in the map; the base map's
          # copy comes back as the `prior` side of each note's predicate
          sys=$(nix eval --raw --impure --expr 'builtins.currentSystem')
          nix eval --json ".#legacyPackages.$sys.updateNotes.versions" \
            --option accept-flake-config true >note-versions.json ||
            echo '{}' >note-versions.json
          ./scripts/eval-diff.py \
            --rev "${{ github.sha }}" \
            --jobs-out eval-jobs.jsonl \
            --map-out eval-map.json \
            --md-out rebuild-diff.md \
            --summary-out diff-summary.json \
            --base-map-out base-map.json \
            --note-versions note-versions.json \
            --priors-out note-priors.json \
            --base-rev "${candidates[@]}"
          cat rebuild-diff.md >>"$GITHUB_STEP_SUMMARY"
          NOTE_PRIORS=$(cat note-priors.json) nix eval --json --impure \
            ".#legacyPackages.$sys.updateNotes.fired" \
            --apply 'f: f (builtins.fromJSON (builtins.getEnv "NOTE_PRIORS"))' \
            --option accept-flake-config true >update-notes.json ||
            echo '{}' >update-notes.json

      # consumed by test-report.yml (workflow_run, so fork PRs get the check
      # run and sticky comment too); uploaded before the build so a timeout
      # still leaves the eval side of the report
      - name: Upload rebuild diff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rebuild-diff
          path: |
            rebuild-diff.md
            diff-summary.json

      # the rebuild count predicts how long the build below will take, so put
      # it on the PR now: check run in_progress + comment, updated in place by
      # the final Post report. Fork PRs (read-only token) only get the final
      # report, via test-report.yml.
      - name: Post eval report
        if: ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PRELIMINARY: "1"
        with:
          script: |
            const post = require('${{ github.workspace }}/scripts/post-report.js');
            await post({github, context, core});

      # publish the eval map so future PRs can diff against this commit
      - name: Publish eval map
        if: github.event_name == 'push'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          # absent when the eval failed; never publish a broken base
          if [ -f eval-map.json ]; then
            aws s3 cp --no-progress eval-map.json \
              "s3://wasinix-cache/eval-maps/${{ github.sha }}.json" \
              --endpoint-url https://1541b1e8a3fc6ad155ce67ef38899700.r2.cloudflarestorage.com
          else
            echo "no eval map (eval failed); skipping publish"
          fi

      # per-package build + JUnit report; uploads to cache as it builds when
      # credentials are present (forks build keyless), so timeouts don't lose work
      - name: Build packages
        id: build
        shell: bash
        run: ./scripts/ci-build.sh
        # empty on fork PRs → build runs without uploading
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
          JOBS_FILE: eval-jobs.jsonl

      # of the rebuilt outputs, which actually changed content vs base?
      # narinfo comparison mostly; only self-referential paths download
      - name: Content diff
        if: ${{ always() && steps.build.conclusion != 'skipped' }}
        continue-on-error: true
        shell: bash
        run: |
          ./scripts/content-diff.py \
            --base-map base-map.json \
            --head-map eval-map.json \
            --junit nix-fast-build-result.xml \
            --md-out content-diff.md \
            --summary-out content-summary.json
          cat content-diff.md >>"$GITHUB_STEP_SUMMARY"

      # one-line status + per-failure details from the JUnit; test-report.yml
      # turns this into the check run title and the sticky comment
      - name: Render report
        if: ${{ always() && steps.build.conclusion != 'skipped' }}
        shell: bash
        run: |
          ./scripts/ci-report.py \
            --junit nix-fast-build-result.xml \
            --jobs eval-jobs.jsonl \
            --diff-summary diff-summary.json \
            --content-summary content-summary.json \
            --notes update-notes.json \
            --md-out build-report.md \
            --json-out report.json
          cat build-report.md >>"$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: ${{ always() && steps.build.conclusion != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-report
          path: |
            build-report.md
            report.json
            content-diff.md
            nix-fast-build-result.xml
          if-no-files-found: error

      # post the check run + sticky comment directly: bot-created PRs (the
      # pin bump) never fire workflow_run, and in-job is faster anyway.
      # Fork PRs have a read-only token here; test-report.yml covers them.
      - name: Post report
        if: ${{ always() && steps.build.conclusion != 'skipped' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        with:
          script: |
            const post = require('${{ github.workspace }}/scripts/post-report.js');
            await post({github, context, core});

  # Publish the static python package index (.#pythonRegistry) to GitHub Pages
  # after a green main build. The build job already built and cached it (tests
  # included), so the nix build here is pure substitution.
  publish-index:
    name: Publish python package index
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # job-level permissions replace the workflow-level set
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: publish-index
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31.9.1
        with:
          extra_nix_config: |
            extra-substituters = https://nix-cache.wasix.org
            extra-trusted-public-keys = wasinix-1:jvsqbOJGsZxMvg97fuyNCWCc+t2nn6uHB47kQCGNmXI=
            trusted-users = root runner

      # the Pages site must exist with build_type=workflow; creating it needs
      # repo admin, which GITHUB_TOKEN never has:
      #   gh api -X POST repos/wasix-org/wasinix/pages -f build_type=workflow
      - name: Build index
        run: |
          nix build .#pythonRegistry --option accept-flake-config true
          # materialize the result symlink with writable modes for the tarring action
          mkdir site
          cp -r --no-preserve=mode,ownership --dereference result/. site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
