name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # don't cancel main: let cache-warming runs finish (PRs still cancel)
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build all packages
    runs-on: depot-ubuntu-24.04-16
    # high ceiling for a cold cache; warm runs finish in minutes (max is 360)
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31.9.1
        with:
          extra_nix_config: |
            extra-substituters = https://nix-cache.wasix.org
            extra-trusted-public-keys = wasinix-1:jvsqbOJGsZxMvg97fuyNCWCc+t2nn6uHB47kQCGNmXI=
            trusted-users = root runner

      # Persist nix's flake-input fetch cache (~2 min/run of cloning wasmer +
      # its transitive inputs). Keyed on flake.lock so it invalidates when inputs move.
      - name: Cache flake inputs
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ~/.cache/nix
          key: nix-flake-inputs-${{ hashFiles('flake.lock') }}
          restore-keys: nix-flake-inputs-

      # Wasmer's nested lib/napi submodule still points quickjs at GitHub SSH.
      - name: Use HTTPS for GitHub git URLs
        shell: bash
        run: |
          sudo git config --system --add url.https://github.com/.insteadOf git@github.com:
          sudo git config --system --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/

      # per-package build + JUnit report; uploads to cache as it builds when
      # credentials are present (forks build keyless), so timeouts don't lose work
      - name: Build packages
        id: build
        shell: bash
        run: ./scripts/ci-build.sh
        # empty on fork PRs → build runs without uploading
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}

      # rendered by test-report.yml (workflow_run, so fork PRs get a check too)
      - name: Upload report
        if: ${{ always() && steps.build.conclusion != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-report
          path: nix-fast-build-result.xml
          if-no-files-found: error
