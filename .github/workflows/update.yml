name: Update package pins

# Bump the repo's own source pins (not the prev.X nixpkgs passthroughs),
# scheduled and on demand. Opens a PR; the existing per-package CI validates
# the builds.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "Space-separated targets to update (blank = all)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Bump pins and open PR
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31.9.1
        with:
          extra_nix_config: |
            extra-substituters = https://nix-cache.wasix.org
            extra-trusted-public-keys = wasinix-1:jvsqbOJGsZxMvg97fuyNCWCc+t2nn6uHB47kQCGNmXI=
            trusted-users = root runner

      - name: Cache flake inputs
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ~/.cache/nix
          key: nix-flake-inputs-${{ hashFiles('flake.lock') }}
          restore-keys: nix-flake-inputs-

      - name: Run updater
        id: run
        shell: bash
        run: |
          args=()
          if [ -n "${{ github.event.inputs.only }}" ]; then
            args=(--only ${{ github.event.inputs.only }})
          fi
          # A failed target must not abort the PR for the ones that bumped: capture
          # the exit code (the script already isolates targets) and re-raise it at
          # the end of the job, after the partial PR is opened.
          # Summary outside the checkout so create-pull-request doesn't commit it.
          summary="$RUNNER_TEMP/update-summary.md"
          set +e
          nix run .#scripts.update -- "${args[@]}" --summary-out "$summary"
          code=$?
          set -e
          {
            echo "exit_code=$code"
            echo 'summary<<EOF'
            cat "$summary" 2>/dev/null || echo "(the updater crashed before writing a summary)"
            echo EOF
          } >>"$GITHUB_OUTPUT"

      - name: Format
        shell: bash
        run: nix fmt

      # UPDATE_PR_TOKEN: events from the default GITHUB_TOKEN don't cascade,
      # so a PR created with it never triggers CI (someone has to press
      # re-run). Set the secret to a fine-grained PAT (or GitHub App token)
      # with contents + pull-requests write on this repo and CI runs on the
      # PR like on any other; without it, today's manual-re-run behavior.
      - name: Open PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.UPDATE_PR_TOKEN || github.token }}
          branch: auto/update-pins
          title: "pins: automated source-pin bump"
          commit-message: "pins: bump repo source pins (automated)"
          body: |
            Automated bump of this repo's source pins. Failed targets keep
            their old pins; everything else bumped anyway, so CI can validate
            the rest.

            ${{ steps.run.outputs.summary }}
          delete-branch: true

      # Re-raise any target failure so the run is red, after the partial PR opens.
      - name: Surface updater failures
        if: steps.run.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "::error::updater reported failed target(s); see the PR body / log"
          exit 1
