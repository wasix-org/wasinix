name: Update package pins

# Bump the repo's own source pins, scheduled and on demand. One runner shares
# discovery and its Nix store while bounded workers isolate each target in a
# worktree. Every moved target still owns one auto/update-<target> PR and one
# ChangeSet, and a broken target does not stop the others.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      targets:
        description: "Space-separated targets to update (blank = all)"
        required: false
        default: ""
      base:
        description: "--base: the branch the PRs target (blank = this ref)"
        required: false
        default: ""
      jobs:
        description: "Maximum updates running at once"
        required: false
        default: "4"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update targets
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Update targets and open PRs
        id: update
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.UPDATE_PR_TOKEN || github.token }}
          TARGETS: ${{ github.event.inputs.targets }}
          BASE: ${{ github.event.inputs.base }}
          JOBS: ${{ github.event.inputs.jobs || 4 }}
        run: |
          targets=()
          if [ -n "$TARGETS" ]; then
            read -r -a targets <<< "$TARGETS"
          else
            targets=(--all)
          fi
          nix run .#update -- "${targets[@]}" --pr --jobs "$JOBS" \
            --base "${BASE:-$GITHUB_REF_NAME}"
