name: Bump publication rel

# Manual only: bump the publication release (+wasix.N) of the given wheels or
# webcs so the next publish republishes them under new versions (e.g. after a
# toolchain fix rebuilds them at the same upstream version). Opens a PR;
# merging it to main runs the normal build + publish.
on:
  workflow_dispatch:
    inputs:
      packages:
        description: Packages to bump (rels.json attr paths, unambiguous names, or fnmatch globs; space- or comma-separated)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: Bump rels and open PR
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31.9.1
        with:
          extra_nix_config: |
            extra-substituters = https://nix-cache.wasix.org
            extra-trusted-public-keys = wasinix-1:jvsqbOJGsZxMvg97fuyNCWCc+t2nn6uHB47kQCGNmXI=
            trusted-users = root runner

      - name: Cache flake inputs
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ~/.cache/nix
          key: nix-flake-inputs-${{ hashFiles('flake.lock') }}
          restore-keys: nix-flake-inputs-

      - name: Bump rels
        id: bump
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          read -ra packages <<<"${PACKAGES//,/ }"
          summary="$RUNNER_TEMP/bump-summary.md"
          nix run .#scripts.bump-rel -- "${packages[@]}" >"$summary"
          {
            echo 'summary<<EOF'
            cat "$summary"
            echo EOF
          } >>"$GITHUB_OUTPUT"

      - name: Format
        run: nix fmt

      # UPDATE_PR_TOKEN (a PAT / App token): without it a PR opened by the
      # default GITHUB_TOKEN does not trigger CI, matching update.yml.
      - name: Open PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.UPDATE_PR_TOKEN || github.token }}
          branch: auto/bump-rel
          title: "pkgs: bump publication release"
          commit-message: "pkgs: bump publication release"
          body: |
            Manual publication-release (+wasix.N) bump. Merging to main
            rebuilds and republishes these packages under new versions.

            ${{ steps.bump.outputs.summary }}
          delete-branch: true
