name: Bump publication release

# Bump the +wasix.N publication release of shipped wheels or webcs when the
# same upstream version needs republishing. `versions bump` writes rels.json.
# Inputs mirror the CLI's flags one to one: `specs` are the positional
# packages; the rest render as the flag of the same name.
on:
  workflow_dispatch:
    inputs:
      specs:
        description: "Packages to bump, optionally @<version>"
        required: false
        default: ""
      changed-from:
        description:
          "--changed-from: bump versions whose publication changed from REF"
        required: false
        default: ""
      all-versions:
        description: "--all-versions: bump every version a package serves"
        required: false
        type: boolean
        default: false
      base:
        description: "--base: the branch the PR targets (blank = this ref)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      # --pr commits as the bot, pushes auto/bump-rel, and opens or updates
      # the PR from the ChangeSet. UPDATE_PR_TOKEN is a PAT/app token so the
      # PR's CI cascades; without it, the default token opens a PR that needs
      # a manual re-run.
      - name: Bump rels and open PR
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.UPDATE_PR_TOKEN || github.token }}
          SPECS: ${{ github.event.inputs.specs }}
          CHANGED_FROM: ${{ github.event.inputs['changed-from'] }}
          ALL_VERSIONS: ${{ github.event.inputs['all-versions'] }}
          BASE: ${{ github.event.inputs.base }}
        run: |
          args=()
          read -ra specs <<<"$SPECS"
          args+=("${specs[@]}")
          [ -n "$CHANGED_FROM" ] && args+=(--changed-from "$CHANGED_FROM")
          [ "$ALL_VERSIONS" = "true" ] && args+=(--all-versions)
          nix run .#wasinix -- versions bump "${args[@]}" --pr --base "${BASE:-$GITHUB_REF_NAME}"
