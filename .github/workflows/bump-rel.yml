name: Bump publication release

# Bump the +wasix.N publication release of shipped wheels or webcs when the
# same upstream version needs republishing. `versions bump` writes rels.json;
# `--changed-from` selects versions whose publication derivations moved.
on:
  workflow_dispatch:
    inputs:
      specs:
        description:
          "Packages to bump (blank with changed-from selects moved ones)"
        required: false
        default: ""
      changed_from:
        description: "Bump versions changed from this ref"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      # --pr commits as the bot, pushes auto/bump-rel, and opens or updates
      # the PR from the ChangeSet. UPDATE_PR_TOKEN is a PAT/app token so the
      # PR's CI cascades; without it, the default token opens a PR that needs
      # a manual re-run.
      - name: Bump rels and open PR
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.UPDATE_PR_TOKEN || github.token }}
          SPECS: ${{ github.event.inputs.specs }}
          CHANGED_FROM: ${{ github.event.inputs.changed_from }}
        run: |
          args=()
          if [ -n "$CHANGED_FROM" ]; then
            args=(--changed-from "$CHANGED_FROM")
          else
            read -ra specs <<<"$SPECS"
            args=("${specs[@]}")
          fi
          nix run .#wasinix -- versions bump "${args[@]}" --pr --base "$GITHUB_REF_NAME"
