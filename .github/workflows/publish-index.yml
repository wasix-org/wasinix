name: Publish index

# Publishing mutates the append-only wheel volume, so it must never run on a PR
# or a failed build: trigger only after a green CI run on main.
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]

concurrency:
  group: publish-index
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

env:
  REGISTRY: wasmer.io
  INDEX_ARTIFACT_KIND: registry
  INDEX_ARTIFACT_NAME: python

jobs:
  publish:
    name: Publish python package index
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # the app itself is resolved from pkgs/python-registry/app.yaml (app_id)
      INDEX_VOLUME: index
    steps:
      - name: Download build result
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-run
          path: run-dir
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Read index identity
        id: identity
        shell: bash
        run: |
          matched="$({
            jq -r \
              --arg kind "$INDEX_ARTIFACT_KIND" \
              --arg name "$INDEX_ARTIFACT_NAME" \
              '. as $map
               | .info | to_entries[]
               | select(.value.role == "artifact"
                   and .value.artifactKind == $kind
                   and .value.displayName == $name)
               | $map.outputs[.key].out // empty' \
              run-dir/cases/*/maps/eval-map.json
          } | sort -u)"
          paths=()
          if [ -n "$matched" ]; then
            mapfile -t paths <<< "$matched"
          fi
          if [ "${#paths[@]}" -ne 1 ]; then
            echo "expected one $INDEX_ARTIFACT_NAME $INDEX_ARTIFACT_KIND artifact in the Build result, found ${#paths[@]}" >&2
            exit 1
          fi
          echo "path=${paths[0]}" >> "$GITHUB_OUTPUT"
          echo "key=python-index-${paths[0]##*/}" >> "$GITHUB_OUTPUT"

      - name: Check publication state
        id: published
        uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: .wasinix-published-index
          key: ${{ steps.identity.outputs.key }}
          lookup-only: true

      - name: Checkout
        id: checkout
        if: steps.published.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          # workflow_run does not check out the triggering commit by default
          ref: ${{ github.event.workflow_run.head_sha }}

      # A single wasmer namespace token; the job fetches the volume's S3
      # credentials at runtime (provisioning them on the first run).
      - name: Select wasmer registry
        if: steps.published.outputs.cache-hit != 'true'
        uses: ./.github/actions/wasmer-registry
        with:
          registry: ${{ env.REGISTRY }}
          token-prod: ${{ secrets.WASMER_TOKEN }}
          token-staging: ${{ secrets.WASMER_TOKEN_STAGING }}
          token-dev: ${{ secrets.WASMER_TOKEN_DEV }}

      - name: Set up Nix
        if: steps.published.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-nix

      - name: Realise index
        id: build-index
        if: steps.published.outputs.cache-hit != 'true'
        env:
          INDEX_PATH: ${{ steps.identity.outputs.path }}
        run: |
          nix-store --realise "$INDEX_PATH"
          ln -s "$INDEX_PATH" registry-result

      - name: Publish wheels to the index volume
        id: publish-volume
        if:
          steps.published.outputs.cache-hit != 'true' && env.WASMER_TOKEN != ''
        run: |
          nix run .#wasinix -- python publish \
            "$(readlink -f registry-result)" \
            --rev "${{ github.event.workflow_run.head_sha }}"

      # the Pages site must exist with build_type=workflow; creating it needs
      # repo admin, which GITHUB_TOKEN never has:
      #   gh api -X POST repos/wasix-org/wasinix/pages -f build_type=workflow
      - name: Prepare Pages snapshot
        id: stage-pages
        # Pages intentionally tracks the fresh build, independently of the
        # append-only volume publication above.
        if:
          always() && steps.published.outputs.cache-hit != 'true' &&
          steps.build-index.outcome == 'success'
        run: |
          mkdir -p site/simple
          cp --no-preserve=mode,ownership --dereference \
            registry-result/index.html registry-result/packages.json site/
          cp --no-preserve=mode,ownership --dereference \
            registry-result/simple/index.html site/simple/
          for page in registry-result/simple/*/index.html; do
            project="$(basename "$(dirname "$page")")"
            cp -r --no-preserve=mode,ownership --dereference \
              "registry-result/simple/$project" site/simple/
          done

      - name: Upload Pages artifact
        if:
          always() && steps.published.outputs.cache-hit != 'true' &&
          steps.build-index.outcome == 'success'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        if:
          always() && steps.published.outputs.cache-hit != 'true' &&
          steps.build-index.outcome == 'success'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Record publication
        if:
          always() && steps.publish-volume.outcome == 'success' &&
          steps.deploy.outcome == 'success'
        env:
          INDEX_PATH: ${{ steps.identity.outputs.path }}
        run: echo "$INDEX_PATH" > .wasinix-published-index

      - name: Save publication state
        id: save_publication_state
        if:
          always() && steps.publish-volume.outcome == 'success' &&
          steps.deploy.outcome == 'success'
        uses: actions/cache/save@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: .wasinix-published-index
          key: ${{ steps.identity.outputs.key }}
