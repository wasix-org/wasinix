name: Publish index

# Publishing mutates the append-only wheel volume, so it must never run on a PR
# or a failed build: trigger only after a green CI run on main.
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]

concurrency:
  group: publish-index
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  REGISTRY: wasmer.io

jobs:
  publish:
    name: Publish python package index
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # the app itself is resolved from pkgs/python-registry/app.yaml (app_id)
      INDEX_VOLUME: index
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run does not check out the triggering commit by default
          ref: ${{ github.event.workflow_run.head_sha }}

      # A single wasmer namespace token; the job fetches the volume's S3
      # credentials at runtime (provisioning them on the first run).
      - name: Select wasmer registry
        uses: ./.github/actions/wasmer-registry
        with:
          registry: ${{ env.REGISTRY }}
          token-prod: ${{ secrets.WASMER_TOKEN }}
          token-staging: ${{ secrets.WASMER_TOKEN_STAGING }}
          token-dev: ${{ secrets.WASMER_TOKEN_DEV }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31.9.1
        with:
          extra_nix_config: |
            extra-substituters = https://nix-cache.wasix.org
            extra-trusted-public-keys = wasinix-1:jvsqbOJGsZxMvg97fuyNCWCc+t2nn6uHB47kQCGNmXI=
            trusted-users = root runner

      - name: Cache flake inputs
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ~/.cache/nix
          key: nix-flake-inputs-${{ hashFiles('flake.lock') }}
          restore-keys: nix-flake-inputs-

      - name: Build index
        id: build-index
        run:
          nix build .#pythonRegistry -o registry-result --option
          accept-flake-config true

      - name: Publish wheels to the index volume
        if: env.WASMER_TOKEN != ''
        run: |
          nix run .#scripts.publish-index -- \
            --registry "$(readlink -f registry-result)" \
            --rev "${{ github.event.workflow_run.head_sha }}"

      # the Pages site must exist with build_type=workflow; creating it needs
      # repo admin, which GITHUB_TOKEN never has:
      #   gh api -X POST repos/wasix-org/wasinix/pages -f build_type=workflow
      - name: Prepare Pages snapshot
        # Pages intentionally tracks the fresh build, independently of the
        # append-only volume publication above.
        if: always() && steps.build-index.outcome == 'success'
        run: |
          # materialize the result symlink with writable modes for the tarring action
          mkdir site
          cp -r --no-preserve=mode,ownership --dereference registry-result/. site/

      - name: Upload Pages artifact
        if: always() && steps.build-index.outcome == 'success'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        if: always() && steps.build-index.outcome == 'success'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
