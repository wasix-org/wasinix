name: Publish index

# Publishing mutates the append-only wheel volume, so it must never run on a PR
# or a failed build: trigger only after a green CI run on main.
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]

concurrency:
  group: publish-index
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  REGISTRY: wasmer.io
  INDEX_ARTIFACT_KIND: registry
  INDEX_ARTIFACT_NAME: python

jobs:
  publish:
    name: Publish python package index
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    # a backfill uploads the whole volume one object at a time (the S3 proxy
    # fails on concurrency, so --transfers 1); a routine publish still finishes
    # in minutes.
    timeout-minutes: 120
    env:
      # the app itself is resolved from pkgs/python-registry/app.yaml (app_id)
      INDEX_VOLUME: index
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run does not check out the triggering commit by default
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      # Evaluate the index at the triggering commit rather than reading the
      # Build's eval map, which reuses the baseline path for any job the commit
      # did not touch: a commit that leaves the index alone would otherwise
      # republish the pre-change index.
      - name: Read index identity
        id: identity
        run: |
          path="$(nix eval --raw \
            ".#legacyPackages.x86_64-linux.artifacts.$INDEX_ARTIFACT_KIND.$INDEX_ARTIFACT_NAME.outPath")"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "key=python-index-${path##*/}" >> "$GITHUB_OUTPUT"

      - name: Check publication state
        id: published
        uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: .wasinix-published-index
          key: ${{ steps.identity.outputs.key }}
          lookup-only: true

      # A single wasmer namespace token; the job fetches the volume's S3
      # credentials at runtime (provisioning them on the first run).
      - name: Select wasmer registry
        if: steps.published.outputs.cache-hit != 'true'
        uses: ./.github/actions/wasmer-registry
        with:
          registry: ${{ env.REGISTRY }}
          token-prod: ${{ secrets.WASMER_TOKEN }}
          token-staging: ${{ secrets.WASMER_TOKEN_STAGING }}
          token-dev: ${{ secrets.WASMER_TOKEN_DEV }}

      - name: Realise index
        id: build-index
        if: steps.published.outputs.cache-hit != 'true'
        env:
          INDEX_PATH: ${{ steps.identity.outputs.path }}
        run: |
          nix-store --realise "$INDEX_PATH"
          ln -s "$INDEX_PATH" registry-result

      - name: Publish wheels to the index volume
        id: publish-volume
        if:
          steps.published.outputs.cache-hit != 'true' && env.WASMER_TOKEN != ''
        run: |
          nix run .#wasinix -- python publish \
            "$(readlink -f registry-result)" \
            --rev "${{ github.event.workflow_run.head_sha }}"

      - name: Record publication
        if: always() && steps.publish-volume.outcome == 'success'
        env:
          INDEX_PATH: ${{ steps.identity.outputs.path }}
        run: echo "$INDEX_PATH" > .wasinix-published-index

      - name: Save publication state
        id: save_publication_state
        if: always() && steps.publish-volume.outcome == 'success'
        uses: actions/cache/save@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: .wasinix-published-index
          key: ${{ steps.identity.outputs.key }}
