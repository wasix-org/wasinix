name: PR preview

# Gated on a green Build of the PR (the CI cache then serves every artifact,
# and no preview is minted for commits that fail CI): the main trigger is
# Build completing for a same-repo PR labeled `preview`; the `labeled`
# trigger covers labeling an already-green PR, whose Build's workflow_run
# event has already fired. Publishes the PR's changed webcs as
# <version>-pr<N>.g<sha7> prereleases (distinct versions per iteration, hidden
# from `latest`; registry versions are immutable, so they accumulate) and
# deploys the changed wheels as an ephemeral per-PR index app, consumed as an
# overlay via --extra-index-url; preview-cleanup.yml deletes the app when the
# PR closes. Everything lands in NAMESPACE, never one holding released
# packages.
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
  pull_request:
    types: [labeled]

concurrency:
  group:
    preview-${{ github.event.pull_request.number ||
    github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  preview:
    name: Publish PR preview
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'preview' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # prod, where the released dependencies a preview resolves against
      # actually live; the dev registry was flaky and holds almost nothing
      REGISTRY: wasmer.io
      # stop-gap until an org-owned namespace exists
      NAMESPACE: kilyanni
    steps:
      # Default-branch code resolves the trigger before the untrusted PR head
      # is checked out. A non-preview event pays setup but publishes nothing.
      - name: Checkout adapter
        id: adapter_checkout
        uses: actions/checkout@v4

      - name: Set up Nix
        id: adapter_setup
        uses: ./.github/actions/setup-nix

      - name: Resolve context
        id: ctx
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          nix run .#ci -- preview-context --repository "$GITHUB_REPOSITORY"
          --event "$GITHUB_EVENT_PATH" --github-output "$GITHUB_OUTPUT"

      - name: Checkout
        id: head_checkout
        if: steps.ctx.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          # the real head commit, not the merge ref: the preview provenance
          # records a rev consumers can fetch
          ref: ${{ steps.ctx.outputs.headSha }}

      - name: Select wasmer registry
        if: steps.ctx.outputs.proceed == 'true'
        uses: ./.github/actions/wasmer-registry
        with:
          registry: ${{ env.REGISTRY }}
          token-prod: ${{ secrets.WASMER_TOKEN }}
          token-staging: ${{ secrets.WASMER_TOKEN_STAGING }}
          token-dev: ${{ secrets.WASMER_TOKEN_DEV }}

      - name: Checkout base
        id: base_checkout
        if: steps.ctx.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ctx.outputs.baseRef }}
          path: base

      # claims the comment before the long part, so the PR shows the preview
      # is coming (and, on failure, that it was attempted)
      - name: Comment (in progress)
        if: steps.ctx.outputs.proceed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.ctx.outputs.headSha }}
          PR: ${{ steps.ctx.outputs.pullRequest }}
          TAG: ${{ steps.ctx.outputs.tag }}
        run: |
          nix run .#wasinix --option accept-flake-config true -- \
            preview "$TAG" --status building \
            --pull-request "$PR" --rev "$HEAD_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Publish preview
        id: publish_preview
        if: steps.ctx.outputs.proceed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.ctx.outputs.headSha }}
          PR: ${{ steps.ctx.outputs.pullRequest }}
          TAG: ${{ steps.ctx.outputs.tag }}
        run: |
          nix run .#wasinix --option accept-flake-config true -- \
            preview "$TAG" --base base \
            --registry "$WASMER_REGISTRY" --namespace "$NAMESPACE" \
            --rev "$HEAD_SHA" \
            --pull-request "$PR" --comment \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      # the CLI posts its own failure state; this covers a job that died
      # before or outside it
      - name: Comment (failed)
        if: failure() && steps.ctx.outputs.proceed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.ctx.outputs.headSha }}
          PR: ${{ steps.ctx.outputs.pullRequest }}
          TAG: ${{ steps.ctx.outputs.tag }}
        run: |
          nix run .#wasinix --option accept-flake-config true -- \
            preview "$TAG" --status failed \
            --pull-request "$PR" --rev "$HEAD_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
