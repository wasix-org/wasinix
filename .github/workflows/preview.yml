name: PR preview

# Gated on a green Build of the PR (the CI cache then serves every artifact,
# and no preview is minted for commits that fail CI): the main trigger is
# Build completing for a same-repo PR labeled `preview`; the `labeled`
# trigger covers labeling an already-green PR, whose Build's workflow_run
# event has already fired. Publishes the PR's changed webcs to the dev
# registry as <version>-pr<N>.g<sha7> prereleases (distinct versions per
# iteration, hidden from `latest`; no cleanup exists, they accumulate on the
# dev registry) and deploys the changed wheels as an ephemeral per-PR index
# app, consumed as an overlay via --extra-index-url; preview-cleanup.yml
# deletes the app when the PR closes.
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
  pull_request:
    types: [labeled]

concurrency:
  group:
    preview-${{ github.event.pull_request.number ||
    github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  preview:
    name: Publish PR preview
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'preview' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # previews stay on the dev registry: the prerelease versions are
      # immutable and accumulate
      REGISTRY: wasmer.wtf
    steps:
      # Both trigger shapes funnel into PR/HEAD_SHA/BASE_REF + a proceed flag:
      # the workflow_run path resolves the PR from the run's head sha and
      # requires the `preview` label; the labeled path requires the head
      # sha's Build to have already succeeded.
      - name: Resolve context
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_HEAD_REPO:
            ${{ github.event.workflow_run.head_repository.full_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          proceed=false pr="" head_sha="" base_ref=""
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            head_sha="$WR_HEAD_SHA"
            if [ "$WR_HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
              pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head_sha/pulls" \
                --jq '[.[] | select(.state == "open")][0].number // empty')
            fi
          else
            pr="$EVENT_PR"
            head_sha="$EVENT_HEAD_SHA"
            conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow Build \
              --commit "$head_sha" --json conclusion --jq '.[0].conclusion // empty')
            if [ "$conclusion" != success ]; then
              echo "Build for $head_sha is not green yet; its workflow_run event will pick this up"
              pr=""
            fi
          fi
          if [ -n "$pr" ]; then
            labeled=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" \
              --json state,isCrossRepository,labels \
              --jq 'select(.state == "OPEN" and (.isCrossRepository | not))
                    | .labels[].name | select(. == "preview")' | head -1)
            if [ -n "$labeled" ]; then
              proceed=true
              base_ref=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" \
                --json baseRefName --jq .baseRefName)
            fi
          fi
          echo "proceed=$proceed" >>"$GITHUB_OUTPUT"
          {
            echo "PR=$pr"
            echo "HEAD_SHA=$head_sha"
            echo "BASE_REF=$base_ref"
          } >>"$GITHUB_ENV"

      - name: Checkout
        if: steps.ctx.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          # the real head commit, not the merge ref: the preview provenance
          # records a rev consumers can fetch
          ref: ${{ env.HEAD_SHA }}

      - name: Select wasmer registry
        if: steps.ctx.outputs.proceed == 'true'
        uses: ./.github/actions/wasmer-registry
        with:
          registry: ${{ env.REGISTRY }}
          token-prod: ${{ secrets.WASMER_TOKEN }}
          token-staging: ${{ secrets.WASMER_TOKEN_STAGING }}
          token-dev: ${{ secrets.WASMER_TOKEN_DEV }}

      # claims the comment before the long part, so the PR shows the preview
      # is coming (and, on failure, that it was attempted)
      - name: Comment (in progress)
        if: steps.ctx.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "### PR preview"
            echo
            echo "Building for \`${HEAD_SHA:0:7}\`... ([run]($run_url))"
          } >comment.md
          bash scripts/pr-upsert-comment.sh "$PR" comment.md

      - name: Checkout base
        if: steps.ctx.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_REF }}
          path: base

      - name: Install Nix
        if: steps.ctx.outputs.proceed == 'true'
        uses: cachix/install-nix-action@v31.9.1
        with:
          extra_nix_config: |
            extra-substituters = https://nix-cache.wasix.org
            extra-trusted-public-keys = wasinix-1:jvsqbOJGsZxMvg97fuyNCWCc+t2nn6uHB47kQCGNmXI=
            trusted-users = root runner

      - name: Cache flake inputs
        if: steps.ctx.outputs.proceed == 'true'
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ~/.cache/nix
          key: nix-flake-inputs-${{ hashFiles('flake.lock') }}
          restore-keys: nix-flake-inputs-

      - name: Diff against base
        if: steps.ctx.outputs.proceed == 'true'
        run: |
          # the g prefix keeps the sha segment alphanumeric: an all-digit sha
          # with a leading zero is invalid semver (the registry rejects it)
          echo "TAG=pr${PR}.g${HEAD_SHA:0:7}" >>"$GITHUB_ENV"
          nix run .#scripts.preview-diff --option accept-flake-config true -- base | tee diff.json
          rm -rf base

      - name: Publish preview webcs
        if: steps.ctx.outputs.proceed == 'true'
        run: |
          names=$(jq -r '.webcs[].attr' diff.json)
          if [ -z "$names" ]; then
            echo "no webcs changed"
            exit 0
          fi
          # shellcheck disable=SC2086
          nix run .#scripts.publish-webc --option accept-flake-config true -- \
            --registry "$WASMER_REGISTRY" --rev "$HEAD_SHA" --preview "$TAG" $names

      - name: Deploy preview index
        if: steps.ctx.outputs.proceed == 'true'
        id: index
        run: |
          if [ "$(jq '.wheels | length' diff.json)" = 0 ]; then
            echo "no wheels changed"
            exit 0
          fi
          jq '.wheels' diff.json >dists.json
          # attrs carry quoted version segments (anthropic."0.109.1"^dist);
          # xargs would strip the quotes, so build an argv array instead
          mapfile -t attrs < <(jq -r '.wheels[].attr' diff.json \
            | sed 's|^|.#legacyPackages.x86_64-linux.|')
          nix build --accept-flake-config --no-link "${attrs[@]}"
          python3 pkgs/python-registry/make-index.py dists.json site --version-suffix "$TAG"
          # capture the deploy exit separately: `url=$(... | tail -1)` under
          # bash without pipefail would mask a failed deploy behind tail
          nix run .#scripts.preview-index-deploy --option accept-flake-config true -- \
            site "python-registry-pr${PR}" >deploy.out
          url=$(tail -1 deploy.out)
          echo "url=$url" >>"$GITHUB_OUTPUT"

      - name: Comment
        if: steps.ctx.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          INDEX_URL: ${{ steps.index.outputs.url }}
        run: |
          {
            echo "### PR preview (\`$TAG\`)"
            if [ "$(jq '.webcs | length' diff.json)" != 0 ]; then
              echo
              echo "Webcs on \`$WASMER_REGISTRY\` (failures listed in the workflow log):"
              jq -r --arg t "$TAG" --arg r "$WASMER_REGISTRY" \
                '.webcs[] | "- `wasmer run \(.owner)/\(.name)@\(.version)-\($t) --registry \($r)`"' \
                diff.json
            fi
            if [ -n "$INDEX_URL" ]; then
              # the prod index the overlay complements lives on wasmer.io
              # (publish-index.yml), not on the preview registry
              prod=$(nix shell .#wasmer -c wasmer app get wasmer/python-registry \
                --registry wasmer.io --format json | jq -r '.url // empty' || true)
              echo
              echo "Wheel overlay [index]($INDEX_URL), preferred over the published wheels by version:"
              echo '```'
              echo "pip install --index-url $INDEX_URL/simple --extra-index-url ${prod:-<prod index>}/simple <pkg>"
              echo '```'
            fi
            echo
            echo "[workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } >comment.md
          bash scripts/pr-upsert-comment.sh "$PR" comment.md

      - name: Comment (failed)
        if: failure() && steps.ctx.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "### PR preview"
            echo
            echo "Failed for \`${HEAD_SHA:0:7}\`. ([run]($run_url))"
          } >comment.md
          bash scripts/pr-upsert-comment.sh "$PR" comment.md
