name: Select wasmer registry
description: >
  Export WASMER_REGISTRY and the matching WASMER_TOKEN into the job env.
  Registries are per-environment: wasmer.io (prod), wasmer.fun (bugtopia,
  staging), wasmer.wtf (dev). Tokens are per-registry (wasmer rejects a token
  minted on another registry, WASIX-TODO.md); deriving the token from the
  registry here keeps the pair from drifting at any use site. Via GITHUB_ENV so
  later step conditions can test `env.WASMER_TOKEN != ''`.
inputs:
  registry:
    description: Wasmer registry host or URL (wasmer.io, wasmer.fun, wasmer.wtf)
    required: true
  token-prod:
    description: Pass secrets.WASMER_TOKEN (wasmer.io)
    required: false
  token-staging:
    description: Pass secrets.WASMER_TOKEN_STAGING (wasmer.fun)
    required: false
  token-dev:
    description: Pass secrets.WASMER_TOKEN_DEV (wasmer.wtf)
    required: false
runs:
  using: composite
  steps:
    - name: Select registry token
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        TOKEN_PROD: ${{ inputs.token-prod }}
        TOKEN_STAGING: ${{ inputs.token-staging }}
        TOKEN_DEV: ${{ inputs.token-dev }}
      run: |
        case "$REGISTRY" in
        *wasmer.wtf*) token="$TOKEN_DEV" ;;
        *wasmer.fun*) token="$TOKEN_STAGING" ;;
        *) token="$TOKEN_PROD" ;;
        esac
        {
          echo "WASMER_REGISTRY=$REGISTRY"
          echo "WASMER_TOKEN=$token"
        } >>"$GITHUB_ENV"
