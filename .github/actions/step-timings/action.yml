name: Step timings
description:
  Append every completed job's step durations to the step summary, from the
  run's own timing records, so a slow setup step is visible without opening any
  job's log. With publish, the same record is uploaded for `wasinix timings` to
  fold across a range of commits.
inputs:
  rev:
    description: The revision the record is keyed by; $GITHUB_SHA when absent
    default: ""
  publish:
    description:
      Upload the record to the cache; skipped without the S3 credentials, as a
      fork run has none
    default: "false"
runs:
  using: composite
  steps:
    - name: Summarize step timings
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REV: ${{ inputs.rev }}
        PUBLISH: ${{ inputs.publish }}
      run: |
        args=()
        if [ -n "$REV" ]; then args+=(--rev "$REV"); fi
        if [ "$PUBLISH" = "true" ] && [ -n "$AWS_ACCESS_KEY_ID" ]; then
          args+=(--publish)
        fi
        nix run .#ci -- step-timings \
          --step-summary "$GITHUB_STEP_SUMMARY" "${args[@]}"
